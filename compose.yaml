name: pulseops

services:
  timescaledb:
    image: timescale/timescaledb:2.20.3-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulseops}
      POSTGRES_USER: ${POSTGRES_USER:-pulseops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseops}
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  control-plane:
    build:
      context: ./control-plane
    environment:
      DATABASE_URL: jdbc:postgresql://timescaledb:5432/${POSTGRES_DB:-pulseops}
      DATABASE_USER: ${POSTGRES_USER:-pulseops}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-pulseops}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      DEFAULT_LOCATION: ${AGENT_LOCATION:-local}
      DASHBOARD_ORIGIN: http://localhost:3000
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      JAVA_TOOL_OPTIONS: -javaagent:/otel/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: pulseops-control-plane
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACE_SAMPLE_RATIO:-1.0}
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local
      KAFKA_RETRY_MAX_ATTEMPTS: ${KAFKA_RETRY_MAX_ATTEMPTS:-3}
      KAFKA_RETRY_INITIAL_BACKOFF: ${KAFKA_RETRY_INITIAL_BACKOFF:-500ms}
      KAFKA_RETRY_MAX_BACKOFF: ${KAFKA_RETRY_MAX_BACKOFF:-5s}
    ports:
      - "${CONTROL_PLANE_PORT:-8082}:8080"
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${CONTROL_PLANE_PORT:-8082}/api
        NEXT_PUBLIC_GRAFANA_URL: http://localhost:${GRAFANA_PORT:-3001}/d/pulseops-overview/pulseops-overview
    ports:
      - "3000:3000"
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build:
      context: ./agent
    environment:
      KAFKA_BROKERS: kafka:19092
      AGENT_ID: ${AGENT_ID:-local-01}
      AGENT_LOCATION: ${AGENT_LOCATION:-local}
      AGENT_VERSION: 0.4.0
      ALLOW_PRIVATE_TARGETS: "true"
      COMMANDS_DLQ_TOPIC: check.commands.v1.dlq
      KAFKA_RETRY_MAX_ATTEMPTS: ${KAFKA_RETRY_MAX_ATTEMPTS:-3}
      KAFKA_RETRY_INITIAL_BACKOFF: ${KAFKA_RETRY_INITIAL_BACKOFF:-500ms}
      KAFKA_RETRY_MAX_BACKOFF: ${KAFKA_RETRY_MAX_BACKOFF:-5s}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-1.0}
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local
      METRICS_ADDRESS: :9464
    expose:
      - "9464"
    depends_on:
      kafka:
        condition: service_healthy
      control-plane:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  demo-target:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_HTTP_PORT:-4318}:4318"
    depends_on:
      tempo:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      control-plane:
        condition: service_healthy
      agent:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.5
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-pulseops}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
    restart: unless-stopped

volumes:
  timescale-data:
  kafka-data:
  prometheus-data:
  grafana-data:
