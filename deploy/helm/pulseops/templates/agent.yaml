apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pulseops.fullname" . }}-agent
  labels:
    {{- include "pulseops.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  serviceName: {{ include "pulseops.fullname" . }}-agent
  podManagementPolicy: Parallel
  replicas: {{ .Values.agent.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: agent
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: {{ include "pulseops.image" (dict "root" . "image" .Values.agent.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          ports:
            - {name: metrics, containerPort: 9464}
          envFrom:
            - configMapRef: {name: {{ include "pulseops.fullname" . }}}
          env:
            - name: AGENT_POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: AGENT_ID_PREFIX, value: {{ .Values.agent.idPrefix | quote }}}
            - {name: AGENT_ID, value: "$(AGENT_ID_PREFIX)-$(AGENT_POD_NAME)"}
            - {name: AGENT_LOCATION, value: {{ .Values.agent.location | quote }}}
            - {name: AGENT_VERSION, value: {{ .Chart.AppVersion | quote }}}
            - {name: ALLOW_PRIVATE_TARGETS, value: {{ .Values.agent.allowPrivateTargets | quote }}}
            - {name: METRICS_ADDRESS, value: ":9464"}
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulseops.fullname" . }}-agent
  labels:
    {{- include "pulseops.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: agent
  ports:
    - {name: metrics, port: 9464, targetPort: metrics}
