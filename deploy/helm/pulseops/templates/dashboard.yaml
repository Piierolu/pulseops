apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pulseops.fullname" . }}-dashboard
  labels:
    {{- include "pulseops.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: dashboard
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: dashboard
          image: {{ include "pulseops.image" (dict "root" . "image" .Values.dashboard.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          ports:
            - {name: http, containerPort: 3000}
          env:
            - name: CONTROL_PLANE_INTERNAL_URL
              value: http://{{ include "pulseops.fullname" . }}-control-plane:8080/api
            - name: GRAFANA_URL
              value: {{ .Values.config.grafanaUrl | quote }}
            - name: ALLOW_UNAUTHENTICATED_MUTATIONS
              value: {{ .Values.dashboard.allowUnauthenticatedMutations | quote }}
          readinessProbe:
            httpGet: {path: /, port: http}
          livenessProbe:
            httpGet: {path: /, port: http}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulseops.fullname" . }}-dashboard
  labels:
    {{- include "pulseops.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dashboard
  ports:
    - {name: http, port: 3000, targetPort: http}
