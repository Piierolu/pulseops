apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pulseops.fullname" . }}-control-plane
  labels:
    {{- include "pulseops.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  # Lifecycle migrations are not compatible with replicas running the previous release.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: control-plane
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: control-plane
          image: {{ include "pulseops.image" (dict "root" . "image" .Values.controlPlane.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: {{ include "pulseops.fullname" . }}}
          env:
            - name: DATABASE_USER
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: database-username}}
            - name: DATABASE_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: database-password}}
            - {name: JAVA_TOOL_OPTIONS, value: "-javaagent:/otel/opentelemetry-javaagent.jar"}
            - {name: OTEL_SERVICE_NAME, value: pulseops-control-plane}
            - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf}
            - {name: OTEL_METRICS_EXPORTER, value: none}
            - {name: OTEL_LOGS_EXPORTER, value: none}
            - {name: OTEL_TRACES_SAMPLER, value: parentbased_traceidratio}
            - {name: OTEL_TRACES_SAMPLER_ARG, value: {{ .Values.config.traceSampleRatio | quote }}}
            - {name: SECURITY_MODE, value: oidc}
            - {name: OIDC_ISSUER_URI, value: {{ .Values.security.issuerUri | quote }}}
            - {name: OIDC_AUDIENCE, value: {{ .Values.security.audience | quote }}}
            - {name: BOOTSTRAP_ISSUER, value: {{ .Values.security.bootstrapIssuer | quote }}}
            - {name: BOOTSTRAP_SUBJECT, value: {{ .Values.security.bootstrapSubject | quote }}}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            initialDelaySeconds: 20
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            initialDelaySeconds: 30
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulseops.fullname" . }}-control-plane
  labels:
    {{- include "pulseops.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: control-plane
  ports:
    - {name: http, port: 8080, targetPort: http}
